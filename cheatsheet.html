<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <title>Ściąga z języka polskiego</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202a35;
      --muted: #64717d;
      --paper: #fffefa;
      --background: #f6f3ed;
      --line: #e6e2d9;
      --green: #17684d;
      --green-soft: #e9f5ee;
      --red: #b33a35;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 40px 0 56px;
    }

    [hidden] { display: none !important; }

    nav { margin-bottom: 20px; }
    nav a { color: var(--green); font-weight: 700; text-decoration: none; }
    nav a:hover { text-decoration: underline; }

    .sheet, .error {
      padding: 24px 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 12px 32px rgb(52 43 29 / 5%);
    }

    .sheet-meta {
      margin: 0 0 8px;
      color: var(--green);
      font-size: .82rem;
      font-weight: 750;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    h1, h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      letter-spacing: -.025em;
      line-height: 1.2;
    }

    h1 { font-size: clamp(2rem, 7vw, 3rem); }
    .sheet-section { margin-top: 20px; }
    .sheet-section h2 { margin-bottom: 8px; font-size: 1.3rem; }
    .sheet-section p { margin: 0; }
    .sheet-section ul, .sheet-section ol { margin: 0; padding-left: 1.35rem; }
    .sheet-section li + li { margin-top: 4px; }

    .table-scroll { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .94rem;
    }

    th, td {
      padding: 9px 10px;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th { background: #f8f7f3; font-weight: 750; }
    .gender-masculine { color: #155d81; background: #e5f3fa; }
    .gender-feminine { color: #914155; background: #fcebf0; }
    .gender-neuter { color: #68518c; background: #f0ebfa; }
    .gender-masculine, .gender-feminine, .gender-neuter {
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 700;
    }

    .practice-link {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      padding: 9px 15px;
      border-radius: 10px;
      background: var(--green);
      color: white;
      font-weight: 750;
      text-decoration: none;
    }

    .practice-link:hover { background: #11573f; }
    .error h1 { color: var(--red); font-size: 1.6rem; }
    .error p { margin: 8px 0 0; color: var(--muted); overflow-wrap: anywhere; }

    @media (max-width: 560px) {
      main { width: min(100% - 24px, 760px); padding-top: 24px; }
      .sheet, .error { padding: 20px 16px; }
      .sheet-section { margin-top: 16px; }
      th, td { padding: 7px; }
    }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Nawigacja">
      <a id="back-link" href="index.html">← Do ćwiczeń</a>
    </nav>
    <article class="sheet" id="sheet" hidden>
      <p class="sheet-meta" id="sheet-meta"></p>
      <h1 id="sheet-title"></h1>
      <div class="sheet-content" id="sheet-content"></div>
    </article>
    <section class="error" id="sheet-error" role="alert" hidden>
      <h1 id="error-title">Nie udało się otworzyć ściągi</h1>
      <p id="error-message"></p>
    </section>
  </main>
  <script type="module" src="cheatsheet.js"></script>
</body>
</html>
