<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <title>Ćwiczenie odmiany czasowników</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202a35;
      --muted: #64717d;
      --paper: #fffefa;
      --background: #f6f3ed;
      --line: #e6e2d9;
      --green: #17684d;
      --green-soft: #e9f5ee;
      --red: #b33a35;
      --red-soft: #fff0ed;
      --accent: #d3523e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 48px 0 64px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 7vw, 3.5rem);
      font-weight: 600;
      letter-spacing: -.045em;
      line-height: 1.1;
    }

    .intro {
      margin: 12px 0 28px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .page-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .page-nav a {
      color: var(--green);
      font-size: .9rem;
      font-weight: 700;
      text-decoration: none;
    }

    .page-nav a:hover { text-decoration: underline; }

    .level-links {
      display: flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
    }

    .level-links a {
      padding: 6px 9px;
      border-radius: 8px;
      color: var(--muted);
      font-size: .82rem;
    }

    .level-links a.active {
      background: var(--green-soft);
      color: var(--green);
    }

    .verb-card, .exercise-card, .sentence-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 12px 32px rgb(52 43 29 / 5%);
    }

    [hidden] { display: none !important; }

    .verb-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 26px;
    }

    .verb-label, .meaning {
      display: block;
      color: var(--muted);
      font-size: .83rem;
    }

    .verb {
      margin: 2px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: 600;
    }

    .meaning { margin-top: 1px; }

    .tense-badge {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: .88rem;
      font-weight: 750;
    }

    button, input { font: inherit; }

    .exercise-card {
      margin-top: 18px;
      padding: 24px 26px 26px;
    }

    .instructions {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: .92rem;
    }

    .sentence-card {
      margin-top: 18px;
      padding: 22px 26px;
    }

    .sentence {
      margin: 8px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.15rem, 4vw, 1.45rem);
      overflow-wrap: anywhere;
    }

    .rows { display: grid; gap: 8px; }

    .row {
      display: grid;
      grid-template-columns: minmax(100px, 1fr) minmax(210px, 1.4fr) minmax(90px, .7fr);
      align-items: center;
      gap: 14px;
      min-height: 58px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 11px;
      transition: background .15s, border-color .15s;
    }

    .row.hard-row { grid-template-columns: minmax(0, 1fr); }

    .hard-answer {
      display: flex;
      width: 100%;
      max-width: 360px;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      font-weight: 650;
    }

    .hard-answer .ending {
      width: min(100%, 300px);
      max-width: 100%;
      min-width: 0;
    }

    .hard-row .row-result { grid-column: 1; }

    .row:nth-child(odd) { background: #f8f7f3; }
    .pronoun { font-weight: 650; }

    .answer {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .stem, .suffix {
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
    }

    .suffix { white-space: nowrap; }

    .ending {
      width: 100%;
      min-width: 74px;
      max-width: 180px;
      padding: 8px 10px;
      border: 1px solid #d6d3ca;
      border-radius: 8px;
      outline: none;
      background: white;
      color: var(--ink);
    }

    .ending:focus, button:focus-visible {
      border-color: var(--green);
      outline: 3px solid rgb(23 104 77 / 17%);
      outline-offset: 1px;
    }

    .row-result {
      min-height: 1.4em;
      color: var(--muted);
      font-size: .82rem;
    }

    .row.correct {
      border-color: #c6e4d1;
      background: var(--green-soft);
    }

    .row.incorrect {
      border-color: #f0c9c4;
      background: var(--red-soft);
    }

    .row.correct .row-result { color: var(--green); }
    .row.incorrect .row-result { color: var(--red); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      min-height: 44px;
      padding: 10px 17px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .check-button { background: var(--green); color: white; }
    .check-button:hover { background: #11573f; }
    .secondary-button { border-color: var(--line); background: white; color: var(--ink); }
    .secondary-button:hover { background: #f8f7f3; }

    .summary {
      flex: 1 1 100%;
      min-height: 1.5em;
      margin: 2px 0 0;
      font-weight: 700;
    }

    .summary.success { color: var(--green); }
    .summary.needs-work { color: var(--red); }

    @media (max-width: 560px) {
      main { padding-top: 32px; }
      .page-nav { align-items: flex-start; }
      .verb-card { align-items: flex-start; flex-wrap: wrap; padding: 20px; }
      .exercise-card { padding: 20px 14px; }
      .sentence-card { padding: 20px; }
      .row {
        grid-template-columns: minmax(0, .65fr) minmax(0, 1.35fr);
        gap: 8px;
        padding: 8px;
      }
      .pronoun { min-width: 0; overflow-wrap: anywhere; }
      .answer { min-width: 0; flex-wrap: wrap; white-space: normal; }
      .stem { overflow-wrap: anywhere; }
      .suffix { white-space: normal; overflow-wrap: anywhere; }
      .ending {
        flex: 0 1 8ch;
        width: 8ch;
        min-width: 56px;
        max-width: 100%;
        padding: 8px;
      }
      .row-result { grid-column: 2; }
      .verb { overflow-wrap: anywhere; }
    }

    @media (max-width: 360px) {
      main { width: min(100% - 24px, 760px); }
      .row { grid-template-columns: minmax(0, 1fr); }
      .answer, .row-result { grid-column: 1; }
      .stem, .suffix { font-size: 1rem; }
      .ending { flex-basis: 7ch; width: 7ch; }
    }
  </style>
</head>
<body>
  <main>
    <nav class="page-nav" aria-label="Nawigacja ćwiczenia">
      <a href="index.html">← Wybór ćwiczeń</a>
      <div class="level-links" aria-label="Wybierz poziom">
        <a href="odmiana.html?level=easy" id="easy-link">Łatwy</a>
        <a href="odmiana.html?level=hard" id="hard-link">Trudny</a>
      </div>
    </nav>
    <p class="eyebrow" id="tense-eyebrow">Odmiana czasowników · poziom łatwy</p>
    <h1>Odmiana czasowników</h1>
    <p class="intro" id="intro">Uzupełnij końcówkę jednego czasownika w podanym czasie i dla podanej osoby.</p>

    <section class="verb-card" id="verb-card" aria-labelledby="verb-name">
      <div>
        <span class="verb-label">Odmień czasownik</span>
        <h2 class="verb" id="verb-name">czytać</h2>
        <span class="meaning" id="verb-meaning">odczytywać tekst</span>
      </div>
      <span class="tense-badge" id="tense-name">Czas teraźniejszy</span>
    </section>

    <section class="sentence-card" id="sentence-card" hidden aria-label="Zdanie do uzupełnienia">
      <span class="verb-label">Uzupełnij zdanie</span>
      <p class="sentence" id="sentence-text"></p>
    </section>

    <section class="exercise-card" aria-label="Ćwiczenie odmiany czasowników">
      <p class="instructions" id="instructions">Wpisz końcówkę po podanym temacie czasownika.</p>
      <p class="round-status" id="round-status" aria-live="polite"></p>
      <form id="exercise-form">
        <div class="rows" id="answer-rows"></div>
        <div class="actions">
          <button class="check-button" type="submit">Sprawdź odpowiedzi</button>
          <button class="secondary-button" type="button" id="clear-button">Wyczyść</button>
          <p class="summary" id="summary" aria-live="polite"></p>
        </div>
      </form>
    </section>
  </main>

  <script>
    const presentClasses = {
      am: ["am", "asz", "a", "amy", "acie", "ają"],
      i: ["ę", "isz", "i", "imy", "icie", "ią"],
      ię: ["ię", "isz", "i", "imy", "icie", "ią"],
      ą: ["ę", "isz", "i", "imy", "icie", "ą"],
      y: ["ę", "ysz", "y", "ymy", "ycie", "ą"],
      uj: ["ę", "esz", "e", "emy", "ecie", "ą"],
      j: ["ę", "esz", "e", "emy", "ecie", "ą"],
      sz: ["ę", "esz", "e", "emy", "ecie", "ą"]
    };
    const pastVowelsIaIe = [
      "ia", "ia", "ia", "ia", "ia", "ia", "ia",
      "ie", "ia", "ie", "ia", "ie", "ia"
    ];
    const pastVowelsAie = [
      "a", "a", "a", "a", "a", "a", "a",
      "e", "a", "e", "a", "e", "a"
    ];

    function defineVerb(infinitive, meaning, presentStem, presentClass, pastRoot, pastVowel, extra = {}) {
      return {
        infinitive,
        meaning,
        presentStem,
        presentEndings: presentClasses[presentClass],
        pastRoot,
        pastVowel,
        ...extra
      };
    }

    const verbs = [
      defineVerb("czytać", "odczytywać tekst", "czyt", "am", "czyta", ""),
      defineVerb("mówić", "porozumiewać się za pomocą słów", "mów", "ię", "mów", "i"),
      defineVerb("robić", "wykonywać lub tworzyć", "rob", "ię", "rob", "i"),
      defineVerb("pracować", "wykonywać pracę", "pracuj", "uj", "pracow", "a"),
      defineVerb("być", "istnieć lub znajdować się", "jest", "custom", "by", "", {
        presentEndings: ["em", "eś", "", "eśmy", "eście", "ą"],
        presentStems: ["jest", "jest", "jest", "jest", "jest", "s"],
        futureInfinitive: ""
      }),
      defineVerb("mieć", "posiadać", "ma", "custom", "m", "", {
        presentEndings: ["m", "sz", "", "my", "cie", "ją"],
        pastVowels: pastVowelsIaIe
      }),
      defineVerb("iść", "przemieszczać się pieszo", "id", "custom", "sz", "", {
        presentEndings: ["ę", "ziesz", "zie", "ziemy", "ziecie", "ą"],
        pastStems: ["szed", "sz", "szed", "sz", "szed", "sz", "sz", "sz", "sz", "sz", "sz", "sz", "sz"]
      }),
      defineVerb("brać", "chwytać lub przyjmować", "bior", "custom", "bra", "", {
        presentStems: ["bior", "bier", "bier", "bier", "bier", "bior"],
        presentEndings: ["ę", "zesz", "ze", "zemy", "zecie", "ą"]
      }),
      defineVerb("stać", "pozostawać w pozycji pionowej", "stoj", "custom", "sta", "", {
        presentStems: ["stoj", "sto", "sto", "sto", "sto", "stoj"],
        presentEndings: ["ę", "isz", "i", "imy", "icie", "ą"]
      }),

      defineVerb("mieszkać", "mieć gdzieś swoje miejsce zamieszkania", "mieszk", "am", "mieszka", ""),
      defineVerb("czekać", "pozostawać w oczekiwaniu", "czek", "am", "czeka", ""),
      defineVerb("szukać", "próbować coś znaleźć", "szuk", "am", "szuka", ""),
      defineVerb("słuchać", "odbierać dźwięki lub czyjeś słowa", "słuch", "am", "słucha", ""),
      defineVerb("oglądać", "patrzeć na coś", "ogląd", "am", "ogląda", ""),
      defineVerb("spotykać", "natrafiać na kogoś lub coś", "spotyk", "am", "spotyka", ""),
      defineVerb("pamiętać", "zachowywać coś w pamięci", "pamięt", "am", "pamięta", ""),
      defineVerb("pomagać", "ułatwiać komuś wykonanie czegoś", "pomag", "am", "pomaga", ""),
      defineVerb("pytać", "prosić o informację", "pyt", "am", "pyta", ""),
      defineVerb("kochać", "darzyć kogoś miłością", "koch", "am", "kocha", ""),
      defineVerb("znać", "mieć o kimś lub o czymś wiedzę", "zn", "am", "zna", ""),
      defineVerb("grać", "uczestniczyć w grze lub grać na instrumencie", "gr", "am", "gra", ""),
      defineVerb("wracać", "przychodzić lub przyjeżdżać z powrotem", "wrac", "am", "wraca", ""),
      defineVerb("zaczynać", "rozpoczynać coś", "zaczyn", "am", "zaczyna", ""),
      defineVerb("wybierać", "decydować się na jedną z możliwości", "wybier", "am", "wybiera", ""),
      defineVerb("odpowiadać", "udzielać odpowiedzi", "odpowiad", "am", "odpowiada", ""),
      defineVerb("opowiadać", "przedstawiać wydarzenia słowami", "opowiad", "am", "opowiada", ""),
      defineVerb("rozmawiać", "prowadzić rozmowę", "rozmawi", "am", "rozmaw", "ia", {
        pastVowels: Array(13).fill("ia")
      }),
      defineVerb("zamawiać", "prosić o przygotowanie lub dostarczenie czegoś", "zamawi", "am", "zamawia", ""),
      defineVerb("odwiedzać", "przychodzić do kogoś z wizytą", "odwiedz", "am", "odwiedza", ""),
      defineVerb("sprawdzać", "kontrolować poprawność lub stan czegoś", "sprawdz", "am", "sprawdza", ""),
      defineVerb("otwierać", "powodować, że coś przestaje być zamknięte", "otwier", "am", "otwiera", ""),
      defineVerb("pływać", "poruszać się w wodzie", "pływ", "am", "pływa", ""),
      defineVerb("sprzątać", "czyścić i porządkować pomieszczenie", "sprząt", "am", "sprząta", ""),
      defineVerb("przepraszać", "wyrażać żal za swoje zachowanie", "przeprasz", "am", "przeprasza", ""),
      defineVerb("zapominać", "przestawać pamiętać o czymś", "zapomin", "am", "zapomina", ""),
      defineVerb("przypominać", "przywoływać coś w pamięci", "przypomin", "am", "przypomina", ""),
      defineVerb("ubierać", "zakładać ubranie sobie lub komuś", "ubier", "am", "ubiera", ""),
      defineVerb("wymieniać", "zastępować jedną rzecz inną", "wymieni", "am", "wymienia", ""),
      defineVerb("nazywać się", "mieć określone imię lub nazwę", "nazyw", "am", "nazywa", "", { particle: " się" }),
      defineVerb("spotykać się", "spędzać czas z innymi osobami", "spotyk", "am", "spotyka", "", { particle: " się" }),
      defineVerb("zostawiać", "pozostawiać coś w jakimś miejscu", "zostawi", "am", "zostawia", ""),
      defineVerb("wyglądać", "mieć określony wygląd", "wygląd", "am", "wygląda", ""),
      defineVerb("pisać", "zapisywać słowa lub tekst", "pisz", "sz", "pisa", ""),
      defineVerb("lubić", "odczuwać sympatię do kogoś lub czegoś", "lub", "ię", "lub", "i"),
      defineVerb("chodzić", "przemieszczać się pieszo lub bywać gdzieś", "chodz", "ą", "chodz", "i"),
      defineVerb("wychodzić", "opuszczać jakieś miejsce", "wychodz", "ą", "wychodz", "i"),
      defineVerb("przychodzić", "docierać pieszo do jakiegoś miejsca", "przychodz", "ą", "przychodz", "i"),
      defineVerb("wchodzić", "przemieszczać się do środka", "wchodz", "ą", "wchodz", "i"),
      defineVerb("odchodzić", "oddalać się od jakiegoś miejsca", "odchodz", "ą", "odchodz", "i"),
      defineVerb("płacić", "przekazywać pieniądze za coś", "płac", "ą", "płac", "i"),
      defineVerb("kończyć", "doprowadzać coś do końca", "kończ", "y", "kończ", "y"),
      defineVerb("uczyć", "przekazywać komuś wiedzę lub umiejętności", "ucz", "y", "ucz", "y"),
      defineVerb("liczyć", "ustalać liczbę lub wykonywać obliczenia", "licz", "y", "licz", "y"),
      defineVerb("ćwiczyć", "trenować lub powtarzać umiejętność", "ćwicz", "y", "ćwicz", "y"),
      defineVerb("tłumaczyć", "przekładać tekst na inny język", "tłumacz", "y", "tłumacz", "y"),
      defineVerb("myśleć", "używać umysłu lub mieć opinię", "myśl", "ą", "myśl", "a", {
        pastVowels: pastVowelsAie
      }),
      defineVerb("widzieć", "odbierać obrazy za pomocą wzroku", "widz", "ą", "widz", "ia", {
        pastVowels: pastVowelsIaIe
      }),
      defineVerb("nosić", "mieć coś na sobie lub przenosić", "nos", "ą", "nos", "i", {
        presentStems: ["nosz", "nos", "nos", "nos", "nos", "nosz"]
      }),
      defineVerb("prosić", "zwracać się do kogoś z prośbą", "pros", "ą", "pros", "i", {
        presentStems: ["prosz", "pros", "pros", "pros", "pros", "prosz"]
      }),
      defineVerb("wierzyć", "uważać coś za prawdziwe", "wierz", "y", "wier", "zy"),
      defineVerb("cieszyć się", "odczuwać radość", "ciesz", "y", "ciesz", "y", { particle: " się" }),
      defineVerb("uczyć się", "zdobywać wiedzę lub umiejętności", "ucz", "y", "ucz", "y", { particle: " się" }),
      defineVerb("tłumaczyć się", "wyjaśniać swoje zachowanie", "tłumacz", "y", "tłumacz", "y", { particle: " się" }),
      defineVerb("bać się", "odczuwać strach", "boj", "custom", "ba", "", {
        presentStems: ["boj", "bo", "bo", "bo", "bo", "boj"],
        presentEndings: ["ę", "isz", "i", "imy", "icie", "ą"],
        particle: " się"
      }),

      defineVerb("kupować", "nabywać coś za pieniądze", "kupuj", "uj", "kupow", "a"),
      defineVerb("gotować", "przygotowywać jedzenie", "gotuj", "uj", "gotow", "a"),
      defineVerb("planować", "ustalać, co i kiedy się zrobi", "planuj", "uj", "planow", "a"),
      defineVerb("próbować", "podejmować próbę zrobienia czegoś", "próbuj", "uj", "próbow", "a"),
      defineVerb("organizować", "planować i przygotowywać wydarzenie", "organizuj", "uj", "organizow", "a"),
      defineVerb("podróżować", "przemieszczać się na dalsze odległości", "podróżuj", "uj", "podróżow", "a"),
      defineVerb("studiować", "uczyć się na uczelni wyższej", "studiuj", "uj", "studiow", "a"),
      defineVerb("rezerwować", "wcześniej zapewniać sobie miejsce lub usługę", "rezerwuj", "uj", "rezerw", "owa", {
        pastAspectPair: {
          perfective: { infinitive: "zarezerwować", pastRoot: "zarezerw", pastVowel: "owa" },
          context: "pokój w hotelu na cały tydzień"
        }
      }),
      defineVerb("decydować", "wybierać jedną z możliwości", "decyduj", "uj", "decydow", "a"),
      defineVerb("dziękować", "wyrażać wdzięczność", "dziękuj", "uj", "dziękow", "a"),
      defineVerb("trenować", "regularnie ćwiczyć sport lub umiejętność", "trenuj", "uj", "trenow", "a"),
      defineVerb("malować", "nakładać farbę lub tworzyć obraz", "maluj", "uj", "malow", "a"),
      defineVerb("rysować", "tworzyć obraz za pomocą linii", "rysuj", "uj", "rysow", "a"),
      defineVerb("budować", "wznosić budynek lub tworzyć konstrukcję", "buduj", "uj", "budow", "a"),
      defineVerb("proponować", "przedstawiać pomysł do rozważenia", "proponuj", "uj", "proponow", "a"),
      defineVerb("gratulować", "składać komuś życzenia z powodu sukcesu", "gratuluj", "uj", "gratulow", "a"),
      defineVerb("ratować", "chronić kogoś przed niebezpieczeństwem", "ratuj", "uj", "ratow", "a"),
      defineVerb("przygotowywać", "sprawiać, że coś jest gotowe", "przygotowuj", "uj", "przygotowyw", "a"),
      defineVerb("wykorzystywać", "używać czegoś w określonym celu", "wykorzystuj", "uj", "wykorzystyw", "a"),
      defineVerb("opiekować się", "troszczyć się o kogoś lub o coś", "opiek", "custom", "opiek", "owa", {
        presentEndings: ["uję", "ujesz", "uje", "ujemy", "ujecie", "ują"],
        particle: " się"
      }),
      defineVerb("zajmować się", "poświęcać czas określonej czynności", "zajmuj", "uj", "zajmow", "a", { particle: " się" }),
      defineVerb("interesować się", "odczuwać ciekawość wobec czegoś", "interesuj", "uj", "interesow", "a", { particle: " się" }),
      defineVerb("spóźniać się", "przychodzić lub przyjeżdżać za późno", "spóźni", "am", "spóźnia", "", { particle: " się" }),
      defineVerb("dostawać", "otrzymywać coś", "dostaj", "j", "dostawa", ""),
      defineVerb("dawać", "przekazywać coś komuś", "daj", "j", "dawa", ""),
      defineVerb("poznawać", "dowiedzieć się czegoś lub spotkać kogoś", "poznaj", "j", "poznawa", ""),
      defineVerb("zostawać", "pozostawać w jakimś miejscu lub stanie", "zostaj", "j", "zostawa", ""),
      defineVerb("dodawać", "łączyć coś z czymś lub zwiększać ilość", "dodaj", "j", "dodawa", ""),
      defineVerb("podawać", "przekazywać coś komuś", "podaj", "j", "podawa", ""),
      defineVerb("używać", "posługiwać się czymś", "używ", "am", "używa", ""),
      defineVerb("przeprowadzać", "organizować lub wykonywać coś", "przeprowadz", "am", "przeprowadza", ""),
      defineVerb("prowadzić", "kierować czymś lub pokazywać drogę", "prowadz", "ą", "prowadz", "i"),
      defineVerb("uczestniczyć", "brać udział w jakimś wydarzeniu", "uczestnicz", "y", "uczestnicz", "y"),
      defineVerb("znaczyć", "mieć określone znaczenie", "znacz", "y", "znacz", "y"),
      defineVerb("wydawać", "publikować lub przekazywać coś", "wydaj", "j", "wydawa", ""),
      defineVerb("otrzymywać", "dostawać coś od kogoś", "otrzymuj", "uj", "otrzymyw", "a"),
      defineVerb("wypożyczać", "pożyczać coś na określony czas", "wypożycz", "am", "wypożycza", ""),
      defineVerb("zapraszać", "prosić kogoś o przybycie", "zaprasz", "am", "zaprasza", ""),
      defineVerb("spędzać", "poświęcać czas na jakąś czynność", "spędz", "am", "spędza", ""),
      defineVerb("zachowywać", "postępować w określony sposób lub coś zatrzymywać", "zachowuj", "uj", "zachowyw", "a"),
      defineVerb("rozwijać", "powiększać lub doskonalić coś", "rozwij", "am", "rozwija", ""),
      defineVerb("naprawiać", "przywracać coś do dobrego stanu", "naprawi", "am", "naprawia", ""),
      defineVerb("pokazywać", "sprawiać, że ktoś coś widzi", "pokazuj", "uj", "pokazyw", "a"),
      defineVerb("stosować", "używać określonej metody lub zasady", "stosuj", "uj", "stosow", "a"),
      defineVerb("korzystać", "używać czegoś lub czerpać z tego pożytek", "korzyst", "am", "korzysta", ""),
      defineVerb("tracić", "przestawać coś mieć", "trac", "ą", "trac", "i"),
      defineVerb("należeć", "być czyjąś własnością lub częścią czegoś", "należ", "y", "należ", "a", {
        pastVowels: pastVowelsAie
      }),
      defineVerb("leżeć", "znajdować się w pozycji poziomej", "leż", "y", "leż", "a", {
        pastVowels: pastVowelsAie
      }),
      defineVerb("ważyć", "mieć określoną masę", "waż", "y", "waż", "y"),
      defineVerb("zależeć", "być uzależnionym od czegoś", "zależ", "y", "zależ", "a", {
        pastVowels: pastVowelsAie
      }),

      defineVerb("rozumieć", "pojmować znaczenie lub sens czegoś", "rozum", "custom", "rozum", "", {
        presentEndings: ["iem", "iesz", "ie", "iemy", "iecie", "ieją"],
        pastVowels: pastVowelsIaIe
      }),
      defineVerb("umieć", "mieć określoną umiejętność", "um", "custom", "um", "", {
        presentEndings: ["iem", "iesz", "ie", "iemy", "iecie", "ieją"],
        pastVowels: pastVowelsIaIe
      }),
      defineVerb("wiedzieć", "mieć informację lub wiedzę o czymś", "wi", "custom", "wiedz", "", {
        presentEndings: ["em", "esz", "e", "emy", "ecie", "edzą"],
        pastVowels: pastVowelsIaIe
      })
    ];

    const level = new URLSearchParams(window.location.search).get("level") === "hard" ? "hard" : "easy";
    const tenses = [
      { key: "present", label: "Czas teraźniejszy", instructions: "Wpisz końcówkę po podanym temacie czasownika." },
      { key: "past", label: "Czas przeszły", instructions: "Wpisz całą zmienną część formy, także samogłoskę." },
      { key: "future", label: "Czas przyszły", instructions: "Uzupełnij końcówkę czasownika posiłkowego „być”." }
    ];
    const presentPronouns = ["ja", "ty", "on / ona / ono", "my", "wy", "oni / one"];
    const presentSentenceSubjects = ["ja", "ty", "on", "my", "wy", "oni"];
    const pastForms = [
      { pronoun: "ja (rodzaj męski)", ending: "łem" },
      { pronoun: "ja (rodzaj żeński)", ending: "łam" },
      { pronoun: "ty (rodzaj męski)", ending: "łeś" },
      { pronoun: "ty (rodzaj żeński)", ending: "łaś" },
      { pronoun: "on", ending: "ł" },
      { pronoun: "ona", ending: "ła" },
      { pronoun: "ono", ending: "ło" },
      { pronoun: "my (rodzaj męskoosobowy)", ending: "liśmy" },
      { pronoun: "my (rodzaj niemęskoosobowy)", ending: "łyśmy" },
      { pronoun: "wy (rodzaj męskoosobowy)", ending: "liście" },
      { pronoun: "wy (rodzaj niemęskoosobowy)", ending: "łyście" },
      { pronoun: "oni", ending: "li" },
      { pronoun: "one", ending: "ły" }
    ];
    const pastSentenceSubjects = [
      "Ja (mężczyzna)", "Ja (kobieta)", "Ty (mężczyzna)", "Ty (kobieta)",
      "On", "Ona", "Ono", "My (grupa męskoosobowa)",
      "My (grupa niemęskoosobowa)", "Wy (grupa męskoosobowa)",
      "Wy (grupa niemęskoosobowa)", "Oni", "One"
    ];
    const futurePronouns = ["ja", "ty", "on / ona / ono", "my", "wy", "oni / one"];
    const futureSentenceSubjects = ["ja", "ty", "on", "my", "wy", "oni"];
    const futureEndings = ["ę", "ziesz", "zie", "ziemy", "ziecie", "ą"];
    const form = document.querySelector("#exercise-form");
    const rows = document.querySelector("#answer-rows");
    const summary = document.querySelector("#summary");
    const checkButton = form.querySelector(".check-button");
    const verbCard = document.querySelector("#verb-card");
    const sentenceCard = document.querySelector("#sentence-card");
    let exerciseDeck = [];
    let round = 0;
    let activeExercise;
    let hasChecked = false;

    function shuffle(items) {
      for (let index = items.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [items[index], items[swapIndex]] = [items[swapIndex], items[index]];
      }
      return items;
    }

    function createExerciseDeck() {
      exerciseDeck = shuffle(verbs.flatMap((verb, verbIndex) =>
        tenses.flatMap((tense, tenseIndex) =>
          getRows(verb, tense).map((_, rowIndex) => ({ verbIndex, tenseIndex, rowIndex }))
        )
      ));
      round += 1;
    }

    function getRows(verb, tense) {
      if (tense.key === "present") {
        return presentPronouns.map((pronoun, index) => ({
          pronoun,
          stem: verb.presentStems ? verb.presentStems[index] : verb.presentStem,
          ending: verb.presentEndings[index],
          suffix: verb.particle || ""
        }));
      }

      if (tense.key === "past") {
        return pastForms.map((item, index) => ({
          ...item,
          stem: verb.pastStems ? verb.pastStems[index] : verb.pastRoot,
          ending: `${verb.pastVowels ? verb.pastVowels[index] : verb.pastVowel}${item.ending}`,
          suffix: verb.particle || ""
        }));
      }

      return futurePronouns.map((pronoun, index) => ({
        pronoun,
        stem: "będ",
        ending: futureEndings[index],
        suffix: verb.futureInfinitive === ""
          ? ""
          : ` ${verb.futureInfinitive || verb.infinitive}`
      }));
    }

    function getExerciseVerb(verb, tense) {
      if (level !== "hard" || tense.key !== "past" || !verb.pastAspectPair) return verb;
      return {
        ...verb,
        infinitive: verb.pastAspectPair.perfective.infinitive,
        pastRoot: verb.pastAspectPair.perfective.pastRoot,
        pastVowel: verb.pastAspectPair.perfective.pastVowel
      };
    }

    function createSentence(verb, tense, rowIndex) {
      if (tense.key === "present") {
        return `Codziennie ${presentSentenceSubjects[rowIndex]} ___ (${verb.infinitive}).`;
      }
      if (tense.key === "past") {
        if (verb.pastAspectPair) {
          return `${pastSentenceSubjects[rowIndex]} wczoraj ___ ${verb.pastAspectPair.context} (${verb.infinitive} / ${verb.pastAspectPair.perfective.infinitive}).`;
        }
        return `${pastSentenceSubjects[rowIndex]} wczoraj ___ (${verb.infinitive}).`;
      }
      return `Jutro ${futureSentenceSubjects[rowIndex]} ___ (${verb.infinitive}).`;
    }

    function getFullForm(item) {
      return `${item.stem}${item.ending}${item.suffix || ""}`;
    }

    function renderExercise() {
      if (exerciseDeck.length === 0) createExerciseDeck();
      activeExercise = exerciseDeck.pop();
      hasChecked = false;
      const verb = verbs[activeExercise.verbIndex];
      const tense = tenses[activeExercise.tenseIndex];
      const exerciseVerb = getExerciseVerb(verb, tense);
      const exerciseRows = getRows(exerciseVerb, tense);
      const item = exerciseRows[activeExercise.rowIndex];
      const isEasy = level === "easy";
      verbCard.hidden = !isEasy;
      sentenceCard.hidden = isEasy;
      document.querySelector("#easy-link").classList.toggle("active", isEasy);
      document.querySelector("#hard-link").classList.toggle("active", !isEasy);
      document.querySelector("#tense-eyebrow").textContent =
        `Odmiana czasowników · poziom ${isEasy ? "łatwy" : "trudny"}`;
      document.querySelector("#intro").textContent = isEasy
        ? "Uzupełnij końcówkę jednego czasownika w podanym czasie i dla podanej osoby."
        : "Przeczytaj zdanie i wpisz pełną formę czasownika. Samodzielnie ustal osobę i czas.";
      if (isEasy) {
        document.querySelector("#verb-name").textContent = verb.infinitive;
        document.querySelector("#verb-meaning").textContent = verb.meaning;
        document.querySelector("#tense-name").textContent = tense.label;
      } else {
        document.querySelector("#sentence-text").textContent = createSentence(verb, tense, activeExercise.rowIndex);
      }
      document.querySelector("#instructions").textContent = isEasy
        ? tense.instructions
        : "Wpisz całą odmienioną formę, nie tylko końcówkę.";
      document.querySelector("#round-status").textContent =
        `Runda ${round} · pozostałe pytania: ${exerciseDeck.length}`;
      summary.textContent = "";
      summary.className = "summary";
      checkButton.textContent = "Sprawdź odpowiedzi";

      rows.replaceChildren();
      const row = document.createElement("div");
      row.className = isEasy ? "row" : "row hard-row";
      if (isEasy) {
        row.innerHTML = `
          <span class="pronoun">${item.pronoun}</span>
          <label class="answer">
            <span class="stem">${item.stem}-</span>
            <input class="ending" type="text" autocomplete="off" autocapitalize="off"
              spellcheck="false" aria-label="${item.pronoun}: wpisz końcówkę">
            ${item.suffix ? `<span class="suffix">${item.suffix}</span>` : ""}
          </label>
          <span class="row-result" aria-live="polite"></span>
        `;
      } else {
        row.innerHTML = `
          <label class="hard-answer">
            <span>Wpisz odmienioną formę:</span>
            <input class="ending" type="text" autocomplete="off" autocapitalize="off"
              spellcheck="false" aria-label="Pełna forma czasownika">
          </label>
          <span class="row-result" aria-live="polite"></span>
        `;
      }
      rows.append(row);
    }

    function checkAnswers() {
      const verb = verbs[activeExercise.verbIndex];
      const tense = tenses[activeExercise.tenseIndex];
      const exerciseVerb = getExerciseVerb(verb, tense);
      const item = getRows(exerciseVerb, tense)[activeExercise.rowIndex];
      const row = rows.querySelector(".row");
      const answer = row.querySelector("input").value.trim().toLocaleLowerCase("pl");
      const expected = level === "easy" ? item.ending : getFullForm(item);
      const isCorrect = answer === expected.toLocaleLowerCase("pl");
      row.classList.toggle("correct", isCorrect);
      row.classList.toggle("incorrect", !isCorrect);
      row.querySelector(".row-result").textContent = isCorrect
        ? "Poprawnie"
        : `Poprawna forma: ${getFullForm(item)}`;
      summary.textContent = isCorrect
        ? "Świetnie! Odpowiedź jest poprawna."
        : "Nie tym razem. Sprawdź poprawną formę powyżej.";
      summary.classList.add(isCorrect ? "success" : "needs-work");
      hasChecked = true;
      checkButton.textContent = "Następne ćwiczenie";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (hasChecked) {
        renderExercise();
        return;
      }
      checkAnswers();
    });

    document.querySelector("#clear-button").addEventListener("click", () => {
      if (hasChecked) {
        renderExercise();
      } else {
        form.reset();
        rows.querySelectorAll(".row").forEach((row) => {
          row.classList.remove("correct", "incorrect");
          row.querySelector(".row-result").textContent = "";
        });
        summary.textContent = "";
        summary.className = "summary";
      }
      rows.querySelector("input").focus();
    });

    renderExercise();
  </script>
</body>
</html>
